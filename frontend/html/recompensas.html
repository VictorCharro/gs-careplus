<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recompensas - Care Plus</title>
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/recompensas.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<nav class="navbar-top">
  <div class="navbar-top-container">
    <div class="navbar-home">
      <a href="#" class="home-icon"><img src="../imagens/home.png" alt="Home" class="home-img" /></a>
      <span class="home-text">Sou Beneficiário</span>
    </div>
    <div class="navbar-font-center">
      <div class="font-size-group">
        <button class="font-btn" id="font-increase">A</button>
        <button class="font-btn font-small" id="font-decrease">a</button>
      </div>
    </div>
    <div class="navbar-top-right">
      <div class="contact-icon">🎧</div>
      <div class="navbar-contact">
        <a href="tel:0800-013-2992" class="phone-number">0800-013-2992</a>
        <a href="tel:0800-771-7750" class="phone-number">0800-771-7750</a>
      </div>
      <button class="profile-btn">Perfil</button>
    </div>
  </div>
</nav>

<nav class="navbar-bottom">
  <div class="navbar-bottom-container">
    <div class="navbar-left-section">
      <div class="navbar-logo">
        <img src="../imagens/logo-care-plus.png" alt="Care Plus" class="logo-img" />
      </div>
      <div class="navbar-avatar">
        <img src="../imagens/usuario-sem-foto.png" alt="Usuário" class="avatar-img" />
      </div>
      <div class="navbar-user-info">
        <span class="user-name">Fulando de Tal</span>
        <span class="user-coins">Saldo: 5939 Care Coins</span>
      </div>
    </div>
    <div class="navbar-right-section">
      <a href="#" class="navbar-action">Cancele a Consulta</a>
      <a href="#" class="navbar-action navbar-action-bold">Recompensas</a>
    </div>
  </div>
</nav>

  <main class="main-content">
    <h1 class="page-title">Portal de Recompensas</h1>
    <section class="saldo-section">
      <div class="saldo-box">
        <img src="../imagens/Care Coins.png" alt="Care Coins" class="saldo-coin">
        <div class="saldo-info">
          <span class="saldo-label">Seu saldo:</span>
          <span class="saldo-value">899</span>
          <span class="saldo-moeda">Care Points</span>
        </div>
      </div>
    </section>

    <section class="destaques-section">
      <h2 class="destaques-title">Destaques</h2>
      <div class="cards-grid">
        <div class="reward-card">
          <div class="card-img-box">
            <img src="../imagens/Café Expresso.png" alt="Café Expresso" class="reward-img">
          </div>
          <span class="reward-name">Café Expresso</span>
          <div class="reward-footer">
            <span class="reward-value-display">
              <img src="../imagens/Care Coins.png" alt="Care Coins" class="coin-icon-card">
              <span class="reward-value">10</span>
            </span>
            <button class="btn-resgatar">Resgatar</button>
          </div>
        </div>
        <div class="reward-card">
          <div class="card-img-box">
            <img src="../imagens/Pao de Queijo.png" alt="Pão de Queijo" class="reward-img">
          </div>
          <span class="reward-name">Pão de Queijo</span>
          <div class="reward-footer">
            <span class="reward-value-display">
              <img src="../imagens/Care Coins.png" alt="Care Coins" class="coin-icon-card">
              <span class="reward-value">10</span>
            </span>
            <button class="btn-resgatar">Resgatar</button>
          </div>
        </div>
        <div class="reward-card">
          <div class="card-img-box">
            <img src="../imagens/Torta de Frango.png" alt="Torta de Frango" class="reward-img">
          </div>
          <span class="reward-name">Torta de Frango</span>
          <div class="reward-footer">
            <span class="reward-value-display">
              <img src="../imagens/Care Coins.png" alt="Care Coins" class="coin-icon-card">
              <span class="reward-value">20</span>
            </span>
            <button class="btn-resgatar">Resgatar</button>
          </div>
        </div>
        <div class="reward-card">
          <div class="card-img-box">
            <img src="../imagens/Bolo de Chocolate.png" alt="Bolo de Chocolate" class="reward-img">
          </div>
          <span class="reward-name">Bolo de Chocolate</span>
          <div class="reward-footer">
            <span class="reward-value-display">
              <img src="../imagens/Care Coins.png" alt="Care Coins" class="coin-icon-card">
              <span class="reward-value">30</span>
            </span>
            <button class="btn-resgatar">Resgatar</button>
          </div>
        </div>
        <div class="reward-card">
          <div class="card-img-box">
            <img src="../imagens/Milk - Shake.png" alt="Milk Shake" class="reward-img">
          </div>
          <span class="reward-name">Milk Shake</span>
          <div class="reward-footer">
            <span class="reward-value-display">
              <img src="../imagens/Care Coins.png" alt="Care Coins" class="coin-icon-card">
              <span class="reward-value">30</span>
            </span>
            <button class="btn-resgatar">Resgatar</button>
          </div>
        </div>
        <div class="reward-card">
          <div class="card-img-box">
            <img src="../imagens/Hamburguer + Coca.png" alt="Hamburguer + Coca Cola" class="reward-img">
          </div>
          <span class="reward-name">Hamburguer + Coca Cola</span>
          <div class="reward-footer">
            <span class="reward-value-display">
              <img src="../imagens/Care Coins.png" alt="Care Coins" class="coin-icon-card">
              <span class="reward-value">50</span>
            </span>
            <button class="btn-resgatar">Resgatar</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../js/navbar.js"></script>
</body>
</html>
